[package]
name = "badvpn-udpgw"
version = "0.2.0"
edition = "2024"
description = "UDP gateway for tun2socks (the badvpn-udpgw protocol), reimplemented in Rust on tokio"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Dean6767/RustBadVpnUdpgw"
keywords = ["udpgw", "badvpn", "tun2socks", "udp", "vpn"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "badvpn-udpgw"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
socket2 = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
