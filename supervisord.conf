; ============================================================
; GOJO X-SORCERER SSH+WS — SUPERVISORD CONFIG
; ============================================================
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; ------------------------------------------------------------
; LABEL: Dropbear (SSH daemon)
; Bound to 2224 internally, not exposed publicly — proxy.py is
; the only public-facing listener (port 8080/443 via Cloud Run)
; ------------------------------------------------------------
[program:dropbear]
command=/usr/local/sbin/dropbear -F -E -R -p 2224 -b /etc/x-sorcerer/banner.txt
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/dropbear.err.log
stdout_logfile=/var/log/supervisor/dropbear.out.log

; ------------------------------------------------------------
; LABEL: Proxy (WS <-> SSH bridge)
; ------------------------------------------------------------
[program:proxy]
command=python3 /etc/x-sorcerer/proxy.py
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/proxy.err.log
stdout_logfile=/var/log/supervisor/proxy.out.log

; ------------------------------------------------------------
; LABEL: badvpn-udpgw (UDP gateway for gaming/voice/QUIC)
; FIX: --max-connections-for-client raised 256 -> 16384.
; This is a PER-CLIENT ceiling (each SSH session's own UDP flow
; count), not a global cap — safe to raise on a 1vCPU/2GiB
; instance. Verified against upstream source: when this ceiling
; is hit, badvpn-udpgw evicts the least-recently-used UDP flow
; automatically rather than hard-failing — but a low ceiling
; means active flows get evicted mid-use during a burst (e.g.
; speedtest), which is what was very likely causing the collapse.
; ------------------------------------------------------------
[program:badvpn]
command=badvpn-udpgw --listen-addr 127.0.0.1:7300 --loglevel warning --max-clients 500 --max-connections-for-client 16384
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/badvpn.err.log
stdout_logfile=/var/log/supervisor/badvpn.out.log
