; ============================================================
; GOJO SSH+WS RELAY — SUPERVISORD CONFIG (v2, nginx-fronted)
; ============================================================
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; I put nginx first since it's now my public-facing listener —
; everything else is internal-only and doesn't need to race to
; bind a public port.
; I use the full absolute path here — I confirmed via Alpine's own
; package docs that nginx installs to /usr/sbin/nginx, not just
; "nginx" on a bare PATH. This was the actual root cause of my
; "spawnerr: can't find command" failures — supervisord's default
; execution environment doesn't reliably include /usr/sbin.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

[program:dropbear]
command=/usr/local/sbin/dropbear -F -E -R -p 2224 -b /etc/x-sorcerer/banner.txt -W 262144 -K 60 -I 900
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/dropbear.err.log
stdout_logfile=/var/log/supervisor/dropbear.out.log

; Same fix here — absolute path to python3 instead of relying on PATH.
[program:bridge]
command=/usr/bin/python3 /etc/x-sorcerer/proxy.py
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/bridge.err.log
stdout_logfile=/var/log/supervisor/bridge.out.log

; Absolute path here too, for the same reason.
[program:badvpn]
command=/usr/local/bin/badvpn-udpgw --listen-addr 127.0.0.1:7300 --loglevel warning --max-clients 500 --max-connections-for-client 2048
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/badvpn.err.log
stdout_logfile=/var/log/supervisor/badvpn.out.log
