; ============================================================
; GOJO SSH+WS RELAY — SUPERVISORD CONFIG (v2, nginx-fronted)
; ============================================================
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; I put nginx first since it's now my public-facing listener —
; everything else is internal-only and doesn't need to race to
; bind a public port.
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

[program:dropbear]
command=/usr/local/sbin/dropbear -F -E -R -p 2224 -b /etc/x-sorcerer/banner.txt
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/dropbear.err.log
stdout_logfile=/var/log/supervisor/dropbear.out.log

; I renamed this from "proxy" to "bridge" to be clear it's now
; just the internal WS-terminated -> SSH byte relay, nothing more.
[program:bridge]
command=python3 /etc/x-sorcerer/proxy.py
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/bridge.err.log
stdout_logfile=/var/log/supervisor/bridge.out.log

[program:badvpn]
command=badvpn-udpgw --listen-addr 127.0.0.1:7300 --loglevel warning --max-clients 500 --max-connections-for-client 2048
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/badvpn.err.log
stdout_logfile=/var/log/supervisor/badvpn.out.log
