; ============================================================
; GOJO SSH+WS RELAY — SUPERVISORD CONFIG (v2, nginx-fronted)
; ============================================================
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

; I put nginx first since it's now my public-facing listener —
; everything else is internal-only and doesn't need to race to
; bind a public port.
; I use the full absolute path here — I confirmed via Alpine's own
; package docs that nginx installs to /usr/sbin/nginx, not just
; "nginx" on a bare PATH. This was the actual root cause of my
; "spawnerr: can't find command" failures — supervisord's default
; execution environment doesn't reliably include /usr/sbin.
[program:nginx]
command=/bin/sh /etc/x-sorcerer/wait-for-bridge.sh
autostart=true
autorestart=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dropbear]
command=/usr/local/sbin/dropbear -F -E -R -p 127.0.0.1:2224 -b /etc/x-sorcerer/banner.txt -W 262144 -K 60 -I 900
autostart=true
autorestart=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Same fix here — absolute path to python3 instead of relying on PATH.
[program:bridge]
command=/usr/bin/python3 /etc/x-sorcerer/proxy.py
autostart=true
autorestart=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Absolute path here too, for the same reason.
[program:udpgw]
command=/usr/local/bin/badvpn-udpgw --listen-addr 127.0.0.1:7300 --max-clients 1000 --max-connections-for-client 1024 --udp-mtu 65520 --client-socket-sndbuf 1048576 --loglevel info --udp-idle-timeout 120
autostart=true
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


