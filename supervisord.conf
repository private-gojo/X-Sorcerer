[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:dropbear]
command=/usr/local/sbin/dropbear -F -E -R -p 2224 -b /etc/x-sorcerer/banner.txt
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/dropbear.err.log
stdout_logfile=/var/log/supervisor/dropbear.out.log

[program:websocat]
# The Rust bridge: Listens for WebSocket on 8080, forwards raw TCP to Dropbear on 2224
command=/usr/local/bin/websocat -E ws-l:0.0.0.0:8080 tcp:127.0.0.1:2224
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/websocat.err.log
stdout_logfile=/var/log/supervisor/websocat.out.log

[program:badvpn]
command=badvpn-udpgw --listen-addr 127.0.0.1:7300 --loglevel warning --max-clients 500 --max-connections-for-client 256
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/badvpn.err.log
stdout_logfile=/var/log/supervisor/badvpn.out.log
